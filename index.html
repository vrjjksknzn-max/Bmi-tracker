<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous BMI Tracker</title>
    <!-- Tailwind CSS for clean, responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for the graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-900">BMI Calculator & Graph</h1>
            <p class="text-sm text-gray-500 mt-1">Fast, anonymous, and error-free</p>
        </div>

        <!-- Input Form -->
        <form id="bmiForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Height (cm)</label>
                <input type="number" id="height" required min="50" max="250" placeholder="e.g., 175" 
                    class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Weight (kg)</label>
                <input type="number" id="weight" required min="20" max="300" placeholder="e.g., 70" 
                    class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-md">
                Calculate & Update Graph
            </button>
        </form>

        <!-- Result Box -->
        <div id="resultBox" class="hidden bg-blue-50 border border-blue-100 rounded-xl p-4 text-center">
            <p class="text-xs text-blue-600 font-semibold uppercase tracking-wider">Your Calculated BMI</p>
            <p id="bmiValue" class="text-4xl font-extrabold text-blue-900 my-1">-</p>
            <p id="bmiCategory" class="text-sm font-medium text-gray-700">-</p>
        </div>

        <!-- Graph Section -->
        <div class="pt-2">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 text-center">BMI Category Distribution</h2>
            <div class="bg-gray-50 p-3 rounded-xl border border-gray-200">
                <canvas id="bmiChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        let bmiChart;

        // Load saved data or start with default baseline counts
        function getStoredData() {
            const data = localStorage.getItem('bmi_counts');
            return data ? JSON.parse(data) : [2, 5, 3, 1]; // Sample baseline distribution
        }

        function initChart(counts) {
            const ctx = document.getElementById('bmiChart').getContext('2d');
            if (bmiChart) {
                bmiChart.data.datasets[0].data = counts;
                bmiChart.update();
                return;
            }
            bmiChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Underweight', 'Normal', 'Overweight', 'Obese'],
                    datasets: [{
                        label: 'Submissions',
                        data: counts,
                        backgroundColor: ['#93c5fd', '#34d399', '#fbbf24', '#f87171'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }

        document.getElementById('bmiForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const heightCm = parseFloat(document.getElementById('height').value);
            const weightKg = parseFloat(document.getElementById('weight').value);
            
            if (!heightCm || !weightKg) return;

            const heightM = heightCm / 100;
            const bmi = parseFloat((weightKg / (heightM * heightM)).toFixed(1));

            let categoryIndex = 0;
            let categoryName = "";
            if (bmi < 18.5) { categoryIndex = 0; categoryName = "Underweight"; }
            else if (bmi >= 18.5 && bmi <= 24.9) { categoryIndex = 1; categoryName = "Normal weight"; }
            else if (bmi >= 25 && bmi <= 29.9) { categoryIndex = 2; categoryName = "Overweight"; }
            else { categoryIndex = 3; categoryName = "Obese"; }

            // Display results
            document.getElementById('bmiValue').textContent = bmi;
            document.getElementById('bmiCategory').textContent = categoryName;
            document.getElementById('resultBox').classList.remove('hidden');

            // Update graph data locally
            let counts = getStoredData();
            counts[categoryIndex]++;
            localStorage.setItem('bmi_counts', JSON.stringify(counts));
            
            initChart(counts);
        });

        // Initialize chart on load
        initChart(getStoredData());
    </script>
</body>
</html>
